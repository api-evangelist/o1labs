cli:
  name: zkApp CLI
  package: zkapp-cli
  version: 0.23.0
  binaries:
  - zk
  - zkapp
  - zkapp-cli
  license: Apache-2.0
  repository: https://github.com/o1-labs/zkapp-cli
  homepage: https://docs.minaprotocol.com/zkapps
  install:
  - method: npm
    command: npm install -g zkapp-cli
  purpose: Scaffold, configure, test, and deploy zkApps (zero-knowledge smart contracts) for Mina Protocol.
  commands:
  - command: zk project <name>
    summary: Create a new zkApp project (smart contract + UI scaffold).
  - command: zk example <name>
    summary: Create a project from a named example.
  - command: zk file <name>
    summary: Generate a new SmartContract file and its test file.
  - command: zk config
    summary: Add or edit a deploy alias in the project config.json.
  - command: zk deploy <alias>
    summary: Deploy the smart contract to the network for the given alias.
  - command: zk system
    summary: Show system/environment information for troubleshooting.
  - command: zk lightnet
    summary: Manage a lightweight local Mina blockchain (Lightnet) for testing.
  - command: zk lightnet explorer
    summary: Launch the block explorer for the local Lightnet network.
