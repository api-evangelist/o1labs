aid: o1labs
name: O1labs
description: o1Labs is a blockchain and cryptography company catalyzing a new generation of applications
  powered by zero-knowledge cryptography. It builds Mina Protocol — the world's lightest blockchain (~22KB
  constant chain size), secured by recursive zk-SNARKs — and o1js, an open-source TypeScript framework for
  writing zero-knowledge smart contracts (zkApps) without deep cryptography expertise. o1Labs also maintains
  the Kimchi proof system, the Pickles recursive SNARK, the zkApp CLI, and a family of Mina node, archive,
  and Rosetta SDKs across TypeScript, Go, Python, and Rust.
